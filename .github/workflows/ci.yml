name: Java CI - Tests, Coverage & Static Analysis

# reference: https://github.com/pmd/pmd-github-action

on:
  push:
    branches: ["main", "autonomo2", "auto2", "a2"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Código
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2) JDK
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 3) Build + tests + JaCoCo + PMD (vía Maven)
      - name: Build, test, coverage & static analysis (Maven)
        run: mvn -B clean verify

      # 4) Guardar reportes generados por Maven (para tu tarea)
      - name: Archive JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Archive PMD Maven report
        uses: actions/upload-artifact@v4
        with:
          name: pmd-maven-report
          path: |
            target/pmd.xml
            target/site/pmd.html

      # 5) Análisis extra con pmd-github-action (sobre el código fuente)
      - name: Run PMD GitHub Action
        uses: pmd/pmd-github-action@v2
        id: pmd
        with:
          # usa la versión que ya estás usando con Maven (revisando logs: 7.3.0)
          version: "7.3.0"
          sourcePath: "src/main/java"
          # puedes empezar con quickstart y luego ya afinar
          rulesets: "rulesets/java/quickstart.xml"
          analyzeModifiedFilesOnly: "false" # proyecto pequeño: analiza TODO

      # 6) Subir el SARIF a GitHub Code Scanning
      - name: Upload PMD SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pmd-report.sarif

      # 7) (Opcional) Fallar el pipeline si hay violaciones PMD
      - name: Fail build if PMD violations found
        if: steps.pmd.outputs.violations != '0'
        run: |
          echo "PMD found ${{ steps.pmd.outputs.violations }} violations"
          exit 1
