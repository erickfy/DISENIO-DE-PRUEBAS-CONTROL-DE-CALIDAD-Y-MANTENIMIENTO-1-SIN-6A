name: Java CI - Tests, Coverage & Static Analysis

on:
  push:
    branches: ["main", "autonomo2", "auto2", "a2"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, test, coverage & static analysis (Maven)
        run: mvn -B clean verify

      - name: Archive JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

      - name: Archive PMD Maven report
        uses: actions/upload-artifact@v4
        with:
          name: pmd-maven-report
          path: |
            target/pmd.xml
            target/site/pmd.html

      - name: Run PMD GitHub Action
        uses: pmd/pmd-github-action@v2
        id: pmd
        with:
          version: "7.3.0"
          sourcePath: "src/main/java"
          rulesets: "rulesets/java/quickstart.xml"
          analyzeModifiedFilesOnly: "false"

      - name: Upload PMD SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pmd-report.sarif

      # Solo informar, no fallar
      - name: Report PMD violations (no fail)
        if: steps.pmd.outputs.violations != '0'
        run: |
          echo "⚠️ PMD found ${{ steps.pmd.outputs.violations }} violations (build sigue en success para el laboratorio)"
